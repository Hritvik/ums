name: Foundation checks
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install isolated contract test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r contracts/requirements-test.txt
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - name: Install security scanners
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/google/osv-scanner/cmd/osv-scanner@v1.9.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify contracts, PostgreSQL integration, coverage, and security
        run: ./gradlew check bootJar --no-daemon --console=plain
