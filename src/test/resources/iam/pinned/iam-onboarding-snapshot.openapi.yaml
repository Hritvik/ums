openapi: 3.1.0
info:
  title: IAM App-Scoped Onboarding Snapshot
  version: 1.0.0
  description: Privileged repair snapshot containing only app-scoped onboarding state.
paths:
  /internal/v1/apps/{appRegistrationId}/onboarding:
    get:
      operationId: getAppOnboardingSnapshot
      description: The authenticated registered workload is bound to exactly one app registration. The path appRegistrationId must equal that binding and the credential audience must be https://iam.distracted.invalid/internal/onboarding. A binding mismatch returns the same non-enumerating 404 as an absent app.
      x-required-scope: iam:onboarding:read
      x-required-audience: https://iam.distracted.invalid/internal/onboarding
      x-workload-app-binding: 'path appRegistrationId MUST equal the authenticated workload app registration; mismatch returns 404'
      security:
        - registeredWorkloadMtls: []
        - registeredWorkloadToken: []
      parameters:
        - name: appRegistrationId
          in: path
          required: true
          schema: {type: string, pattern: '^[a-z][a-z0-9-]{2,63}$'}
        - name: cursor
          in: query
          required: false
          schema: {type: string, minLength: 1, maxLength: 512}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
        - name: X-Correlation-ID
          in: header
          required: false
          schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
      responses:
        '200':
          description: Bounded app-scoped onboarding snapshot page.
          headers:
            X-Correlation-ID:
              required: true
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingSnapshotEnvelope'
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RetryableError'}
        '500': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/RetryableError'}
components:
  securitySchemes:
    registeredWorkloadMtls:
      type: mutualTLS
      description: Registered first-party workload certificate bound to one app registration. Authorization also requires scope iam:onboarding:read and audience https://iam.distracted.invalid/internal/onboarding.
    registeredWorkloadToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Accepted 2026-11-08. Workload access token (workload_access v1) bound to one app registration. Authorization also requires scope iam:onboarding:read and audience https://iam.distracted.invalid/internal/onboarding.
  schemas:
    OnboardingSnapshotEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [appRegistrationId, items, hasMore]
          properties:
            appRegistrationId: {type: string, pattern: '^[a-z][a-z0-9-]{2,63}$'}
            items:
              type: array
              maxItems: 200
              items:
                type: object
                additionalProperties: false
                required: [appSubject, activationId, activationState, activationVersion, onboardingReason, onboardingVersion, requiredProfileState]
                properties:
                  appSubject: {type: string, pattern: '^aps_[A-Za-z0-9_-]{22,128}$'}
                  activationId: {type: string, pattern: '^act_[A-Za-z0-9_-]{16,128}$'}
                  activationState: {type: string, const: ACTIVE}
                  activationVersion: {type: integer, minimum: 1}
                  onboardingReason: {type: string, enum: [FIRST_ACTIVATION, RECONCILIATION]}
                  onboardingVersion: {type: integer, minimum: 1}
                  requiredProfileState: {type: string, const: PROFILE_REQUIRED}
            nextCursor: {type: string, minLength: 1, maxLength: 512}
            hasMore: {type: boolean}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, correlationId]
          properties:
            code: {type: string, enum: [invalid_request, unauthorized, forbidden, not_found, rate_limited, internal_error, service_unavailable]}
            message: {type: string, enum: [Request is invalid, Authentication is required, Access is denied, Resource was not found, Request rate limit exceeded, Request could not be completed, Service is temporarily unavailable]}
            correlationId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'}
            details:
              type: array
              maxItems: 16
              items:
                type: object
                additionalProperties: false
                required: [field, code]
                properties:
                  field: {type: string, enum: [appRegistrationId, cursor, limit]}
                  code: {type: string, enum: [missing, malformed, out_of_range]}
          allOf:
            - oneOf:
                - properties: {code: {const: invalid_request}, message: {const: Request is invalid}}
                - properties: {code: {const: unauthorized}, message: {const: Authentication is required}}
                - properties: {code: {const: forbidden}, message: {const: Access is denied}}
                - properties: {code: {const: not_found}, message: {const: Resource was not found}}
                - properties: {code: {const: rate_limited}, message: {const: Request rate limit exceeded}}
                - properties: {code: {const: internal_error}, message: {const: Request could not be completed}}
                - properties: {code: {const: service_unavailable}, message: {const: Service is temporarily unavailable}}
  responses:
    Error:
      description: Standard safe error.
      headers:
        X-Correlation-ID:
          required: true
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    RetryableError:
      description: Standard safe retryable error.
      headers:
        X-Correlation-ID:
          required: true
          schema: {type: string}
        Retry-After:
          required: true
          description: Whole seconds before retrying.
          schema: {type: integer, minimum: 1, maximum: 86400}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
