spring:
  application:
    name: ums
  datasource:
    url: ${UMS_DATABASE_URL:}
    username: ${UMS_DATABASE_USERNAME:}
    password: ${UMS_DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
  flyway:
    enabled: true
    clean-disabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
ums:
  content:
    # authority-uri enables avatar attachment and cleanup; without it attachment stays rejected.
    # authority-uri: https://content.example.test
    # token: ...
    timeout-seconds: ${UMS_CONTENT_TIMEOUT_SECONDS:5}
    cleanup:
      max-attempts: ${UMS_CONTENT_CLEANUP_MAX_ATTEMPTS:8}
  rate-limit:
    reads-per-minute: ${UMS_RATE_LIMIT_READS_PER_MINUTE:60}
    writes-per-minute: ${UMS_RATE_LIMIT_WRITES_PER_MINUTE:20}
    privacy-per-minute: ${UMS_RATE_LIMIT_PRIVACY_PER_MINUTE:10}
    unauthenticated-per-minute: ${UMS_RATE_LIMIT_UNAUTHENTICATED_PER_MINUTE:120}
    # With shared limit infrastructure degraded, the local window tightens to a fifth.
    degraded: ${UMS_RATE_LIMIT_DEGRADED:false}
  maintenance:
    enabled: ${UMS_MAINTENANCE_ENABLED:true}
    # Limits are documented in docs/operations/operating-tier.md and thresholds in
    # docs/operations/runbooks.md.
  # recovery:
  #   erasure-journal-path: /var/lib/ums/erasure-journal.jsonl   # required for privacy mode
  #   backup-status-file: /var/lib/ums/backup-status.json
  #   allow-missing-evidence: false
  #   bootstrap-journal: false   # set once on a first-ever start only
  retention:
    sweep:
      enabled: ${UMS_RETENTION_SWEEP_ENABLED:true}
      # interval, initial-delay and batch-size are documented in docs/development/retention.md.
  outbox:
    relay:
      enabled: ${UMS_OUTBOX_RELAY_ENABLED:false}
      # consumer-uri, interval, batch-size, max-attempts, backoff-base, backoff-max and lease
      # are documented in docs/development/outbox-relay.md.
  security:
    issuer: ${UMS_IAM_ISSUER:}
    jwk-set-uri: ${UMS_IAM_JWK_SET_URI:}
    audience: ${UMS_RESOURCE_AUDIENCE:}
